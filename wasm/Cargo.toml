[package]
name = "reliakit-wasm"
version = "0.3.0"
edition = "2021"
license = "MIT"
description = "ReliaKit browser demo host: raw FFI exports over the reliakit-engine JSON dispatcher, no wasm-bindgen"
authors = ["chickenfeetbatman"]

[lib]
name = "reliakit_wasm"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
reliakit-engine = { path = "../engine" }
serde_json = "1"

[profile.release]
opt-level = 3
