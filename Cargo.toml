[workspace]
members = [".", "gui"]

[package]
name = "reliakit"
version = "0.3.0"
edition = "2021"
license = "MIT"
description = "ReliaKit: hardware reliability engineering suite (life data, limited-data Bayesian methods, degradation, ALT, growth, system RBD, standby and availability, FMEA, warranty, fault trees, DOE)"
authors = ["chickenfeetbatman"]

[lib]
name = "reliakit"
path = "src/lib.rs"

[[bin]]
name = "reliakit"
path = "src/bin/reliakit.rs"

[[bin]]
name = "reliakit-bench"
path = "src/bin/reliakit_bench.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 3
