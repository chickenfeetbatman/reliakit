name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            app_artifact: reliakit-app-linux
            app_binary: reliakit-app
            cli_artifact: reliakit-cli-Linux
            cli_binary: reliakit
          - os: macos-latest
            app_artifact: reliakit-app-macos
            app_binary: reliakit-app
            cli_artifact: reliakit-cli-macOS
            cli_binary: reliakit
          - os: windows-latest
            app_artifact: reliakit-app-windows.exe
            app_binary: reliakit-app.exe
            cli_artifact: reliakit-cli-Windows.exe
            cli_binary: reliakit.exe
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Build release binaries
        run: |
          cargo build --release -p reliakit
          cargo build --release -p reliakit-app
      - name: Package (Linux and macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp "target/release/${{ matrix.app_binary }}" "dist/${{ matrix.app_artifact }}"
          cp "target/release/${{ matrix.cli_binary }}" "dist/${{ matrix.cli_artifact }}"
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist
          Copy-Item "target/release/${{ matrix.app_binary }}" "dist/${{ matrix.app_artifact }}"
          Copy-Item "target/release/${{ matrix.cli_binary }}" "dist/${{ matrix.cli_artifact }}"
      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body: |
            ## ReliaKit v0.3.2

            v0.3.2 is a correctness and validation release. An external review of v0.3.0 found cases where the app could silently change input data or report success on results that were not valid. Those defects are fixed, and results now carry their status with them.

            What was wrong and is now fixed:

            - CSV import truncated fractional failure times (0.1 became 0). Imported values now keep full precision everywhere they are stored, and a fit through CSV import matches a fit on the same numbers entered directly.
            - Invalid input was silently dropped or replaced (a bad token in a data list vanished; a bad mission time became 1000). The app now stops, names the field, the value, and the reason, and does not compute until the input is fixed.
            - Fits could report success on degenerate data (all zeros, negative times, all times identical). Every fit now carries a status: success, success with warnings, boundary or degenerate (with an explanation), or failed (with the reason), shown as a badge on the results.
            - The two-parameter Weibull shape search stopped near beta 20, so tightly clustered data (100, 101, 102, 103, 104) reported shape 20.09 instead of about 80.8. The search is now adaptive and matches the independently computed value; data whose likelihood keeps rising is reported as a boundary case instead of an ordinary fit.
            - Fault trees treated a repeated event as independent, so A OR A returned 0.19 instead of 0.1. Repeated events now share one identity in the probability and the cut sets, and a probability outside 0 to 1 is rejected with the event named.
            - Warranty forecasts counted returns recorded after the analysis period. Future returns are now excluded and the exclusion is counted in the results; returns above a cohort's sales are an error; one age convention now applies to failures and censored units alike.
            - The shifted-exponential fit let an early suspension pull the start of the distribution down to that suspension. Its location is now set by the first failure. The same defect was found and fixed in the three-parameter Weibull.

            Also in v0.3.2:

            - Results show an Outdated badge when their inputs change, and sending an outdated result to another item asks for confirmation first. Transfers label their source and destination and state that a copy is a snapshot.
            - A validation suite with independently computed expectations (published and hand-derived values, second computation paths) and a browser test suite now run in CI next to the unit tests, together with format and lint gates.
            - Workspace improvements: resizable and collapsible panels, RBD fit-to-view with pan and zoom, a compact results grid, duplicate items, a project tree search, and the guided tours updated for the new layout.
            - The availability simulation count is now an input (default 40) and the result reports its Monte Carlo standard error.
            - The desktop app ships with a restrictive Content-Security-Policy and a --headless smoke mode that runs an engine self-check and exits.

            Downloads:

            - Windows: reliakit-app-windows.exe is the desktop app, reliakit-cli-Windows.exe is the command line tool.
            - macOS: reliakit-app-macos is the desktop app, reliakit-cli-macOS is the command line tool.
            - Linux: reliakit-app-linux is the desktop app, reliakit-cli-Linux is the command line tool.

            Unsigned binary notes:

            - Windows SmartScreen: the binaries are not code signed. If Windows shows a warning, choose More info, then Run anyway.
            - macOS Gatekeeper: the binaries are not code signed or notarized. Right-click the file and choose Open to run it the first time. The macOS download is a raw binary, not an .app bundle, so run it from Terminal (for example: chmod +x reliakit-app-macos, then ./reliakit-app-macos).
            - Linux: the app needs the WebKitGTK runtime installed (the libwebkit2gtk-4.1 package on Debian and Ubuntu). The CLI tool has no such dependency.
