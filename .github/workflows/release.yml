name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            app_artifact: reliakit-app-linux
            app_binary: reliakit-app
            cli_artifact: reliakit-cli-Linux
            cli_binary: reliakit
          - os: macos-latest
            app_artifact: reliakit-app-macos
            app_binary: reliakit-app
            cli_artifact: reliakit-cli-macOS
            cli_binary: reliakit
          - os: windows-latest
            app_artifact: reliakit-app-windows.exe
            app_binary: reliakit-app.exe
            cli_artifact: reliakit-cli-Windows.exe
            cli_binary: reliakit.exe
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Build release binaries
        run: |
          cargo build --release -p reliakit
          cargo build --release -p reliakit-app
      - name: Package (Linux and macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp "target/release/${{ matrix.app_binary }}" "dist/${{ matrix.app_artifact }}"
          cp "target/release/${{ matrix.cli_binary }}" "dist/${{ matrix.cli_artifact }}"
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist
          Copy-Item "target/release/${{ matrix.app_binary }}" "dist/${{ matrix.app_artifact }}"
          Copy-Item "target/release/${{ matrix.cli_binary }}" "dist/${{ matrix.cli_artifact }}"
      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body: |
            ## ReliaKit v0.3.1

            What is new in v0.3.1:

            - Fixed: RBD blocks could not be dragged to new positions in v0.3.0. Now the whole block drags smoothly, and the new position is saved in the project file and restored when the project is reopened.
            - Fixed (correctness): RBD diagrams now draw the topology that is actually evaluated. Parallel and k-out-of-n groups draw as branches between split and merge rails, standby groups show their standby unit, and nested groups are framed and labeled, so the picture matches the model. In v0.3.0 the bundled Example 3 drew its parallel controllers in series.
            - New navigation: a visual picker for all 18 analysis kinds grouped by family, a grouped project tree, a Ctrl+K (Cmd+K on macOS) quick switcher, a consistent header on every item screen with the item name and a one-line description, and Start an analysis cards on the start page.
            - New tutorial wizard: guided tours for all 18 kinds that work in a new item, a Tours list in the toolbar, a Tour this screen button on every item, and the "New here? Build your first project" wizard on the start page with three goal paths.
            - The browser demo is updated with all of the above.

            Downloads:

            - Windows: reliakit-app-windows.exe is the desktop app, reliakit-cli-Windows.exe is the command line tool.
            - macOS: reliakit-app-macos is the desktop app, reliakit-cli-macOS is the command line tool.
            - Linux: reliakit-app-linux is the desktop app, reliakit-cli-Linux is the command line tool.

            Unsigned binary notes:

            - Windows SmartScreen: the binaries are not code signed. If Windows shows a warning, choose More info, then Run anyway.
            - macOS Gatekeeper: the binaries are not code signed or notarized. Right-click the file and choose Open to run it the first time. The macOS download is a raw binary, not an .app bundle, so run it from Terminal (for example: chmod +x reliakit-app-macos, then ./reliakit-app-macos).
            - Linux: the app needs the WebKitGTK runtime installed (the libwebkit2gtk-4.1 package on Debian and Ubuntu). The CLI tool has no such dependency.
